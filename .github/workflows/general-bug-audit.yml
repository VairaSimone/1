name: Asami General Bug Audit

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  audit-and-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: asami-backend/package-lock.json
      - name: Patch confirmed consistency bugs
        working-directory: asami-backend
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          engine = Path('src/simulation/engine.js')
          text = engine.read_text()
          old_sql = "UPDATE actions SET status='COMPLETED',completed_simulation_at=?,result=? WHERE id=UUID_TO_BIN(?) AND entity_id=UUID_TO_BIN(?) AND simulation_id=UUID_TO_BIN(?) AND status='ACTIVE'"
          new_sql = "UPDATE actions SET status='INTERRUPTED',completed_simulation_at=?,result=? WHERE id=UUID_TO_BIN(?) AND entity_id=UUID_TO_BIN(?) AND simulation_id=UUID_TO_BIN(?) AND status='ACTIVE'"
          if old_sql not in text:
              raise SystemExit('expected interruption UPDATE was not found')
          text = text.replace(old_sql, new_sql, 1)

          old_publish = 'action: { ...active, status: "COMPLETED", interrupted: true }'
          new_publish = 'action: { ...active, status: "INTERRUPTED", interrupted: true }'
          if old_publish not in text:
              raise SystemExit('expected interruption publish payload was not found')
          text = text.replace(old_publish, new_publish, 1)
          engine.write_text(text)

          repo = Path('src/repositories/simulation-repo.js')
          text = repo.read_text()
          marker = "async function updateCurrentTimeOptimistic(id, nowSimulation, version) {"
          if marker not in text:
              raise SystemExit('simulation repo insertion marker missing')
          helper = '''async function advanceAndCreateTick(id, nowSimulation, version, tickType, engineVersion) {
  return withTransaction(async conn => {
    const [rows] = await conn.query(`
      SELECT status,version
      FROM simulations
      WHERE id=UUID_TO_BIN(?)
      LIMIT 1
      FOR UPDATE
    `, [id]);
    if (!rows.length || rows[0].status !== "RUNNING" || Number(rows[0].version) !== Number(version)) return null;

    const [updated] = await conn.query(`
      UPDATE simulations
      SET current_simulation_at=?, version=version+1
      WHERE id=UUID_TO_BIN(?) AND version=? AND status='RUNNING'
    `, [nowSimulation, id, version]);
    if (updated.affectedRows !== 1) return null;

    const tickId = uuid();
    await conn.query(`
      INSERT INTO simulation_ticks
        (id,simulation_id,simulation_time,real_started_at,tick_type,status,engine_version)
      VALUES (UUID_TO_BIN(?),UUID_TO_BIN(?),?,UTC_TIMESTAMP(3),?,'RUNNING',?)
    `, [tickId, id, nowSimulation, tickType, engineVersion]);

    return tickId;
  });
}

'''
          text = text.replace(marker, helper + marker, 1)
          old_exports = "  getActiveClock, updateCurrentTimeOptimistic, createTick, finishTick,"
          new_exports = "  getActiveClock, updateCurrentTimeOptimistic, advanceAndCreateTick, createTick, finishTick,"
          if old_exports not in text:
              raise SystemExit('simulation repo export marker missing')
          text = text.replace(old_exports, new_exports, 1)
          repo.write_text(text)

          engine = Path('src/simulation/engine.js')
          text = engine.read_text()
          old_sequence = '''const advanced = await simRepo.updateCurrentTimeOptimistic(sim.id, nextTime, sim.version); if (!advanced) return;
      context.simulationTime = nextTime.toISOString(); phase = "tick.create"; tickId = await simRepo.createTick(sim.id, nextTime, "AUTONOMOUS", env.ENGINE_VERSION);'''
          new_sequence = '''tickId = await simRepo.advanceAndCreateTick(sim.id, nextTime, sim.version, "AUTONOMOUS", env.ENGINE_VERSION); if (!tickId) return;
      context.simulationTime = nextTime.toISOString(); phase = "tick.create";'''
          if old_sequence not in text:
              raise SystemExit('engine clock/tick sequence marker missing')
          text = text.replace(old_sequence, new_sequence, 1)
          engine.write_text(text)

          test = Path('test/engine-helper.test.js')
          text = test.read_text()
          regression = '''\nconst fs=require("node:fs");\nconst path=require("node:path");\ntest("interrupted actions are persisted and published as INTERRUPTED",()=>{\n  const source=fs.readFileSync(path.join(__dirname,"../src/simulation/engine.js"),"utf8");\n  const start=source.indexOf("async function interruptActiveAction");\n  const end=source.indexOf("class SimulationEngine",start);\n  assert.ok(start>=0&&end>start);\n  const section=source.slice(start,end);\n  assert.match(section,/UPDATE actions SET status='INTERRUPTED'/);\n  assert.doesNotMatch(section,/UPDATE actions SET status='COMPLETED'/);\n  assert.match(section,/action: \{ \.\.\.active, status: "INTERRUPTED", interrupted: true \}/);\n});\n'''
          text += regression
          test.write_text(text)
          PY
      - name: Install dependencies
        working-directory: asami-backend
        run: npm ci
      - name: Run backend tests
        working-directory: asami-backend
        run: npm test
      - name: Syntax check all backend JavaScript
        working-directory: asami-backend
        shell: bash
        run: |
          set -euo pipefail
          find src test -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Commit verified fixes and remove temporary audit workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add asami-backend/src/simulation/engine.js asami-backend/src/repositories/simulation-repo.js asami-backend/test/engine-helper.test.js
          git rm .github/workflows/general-bug-audit.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'fix: harden simulation tick and interruption consistency'
          git push origin HEAD:main
