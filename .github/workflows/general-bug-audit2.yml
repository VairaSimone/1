name: Asami General Bug Audit 2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  audit-and-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: asami-backend/package-lock.json
      - name: Apply verified movement fix
        run: python3 tools/general_bug_audit2.py
      - name: Install dependencies
        working-directory: asami-backend
        run: npm ci
      - name: Run backend tests
        working-directory: asami-backend
        run: npm test
      - name: Syntax check all backend JavaScript
        working-directory: asami-backend
        run: find src test -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Commit verified fix and remove temporary audit files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add asami-backend/src/simulation/engine.js asami-backend/test/engine-helper.test.js
          git rm tools/general_bug_audit2.py .github/workflows/general-bug-audit2.yml tools/audit-trigger.txt
          git commit -m 'fix: correct interrupted movement parameter binding'
          git push origin HEAD:main
