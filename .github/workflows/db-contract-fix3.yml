name: Final Asami DB contract cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: asami-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: asami-backend/package-lock.json
      - name: Fix stale planning variable and add regression assertion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/services/planning-service.js')
          s=p.read_text()
          if s.count('if(blockedSteps>0&&refreshedPlan.status!=="CANCELLED")') != 1:
              raise SystemExit('expected exactly one stale blockedSteps reference')
          s=s.replace('if(blockedSteps>0&&refreshedPlan.status!=="CANCELLED")','if(failedSteps>0&&refreshedPlan.status!=="CANCELLED")')
          p.write_text(s)

          t=Path('test/schema-contract-regression.test.js')
          s=t.read_text()
          s=s.replace('assert.match(s,/status=\'FAILED\'/);','assert.match(s,/status=\'FAILED\'/);\n  assert.doesNotMatch(s,/blockedSteps/);')
          t.write_text(s)
          PY
      - run: npm ci
      - run: npm test
      - name: Syntax check
        shell: bash
        run: find src test -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Commit final cleanup and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd ..
          git rm .github/workflows/db-contract-fix3.yml
          git add asami-backend/src/services/planning-service.js asami-backend/test/schema-contract-regression.test.js
          git commit -m "fix: remove stale plan step status variable"
          git push origin HEAD:main
