name: Apply Asami DB contract fixes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/db-contract-audit-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: asami-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: asami-backend/package-lock.json

      - name: Apply verified DB contract fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          def replace_exact(path, old, new, expected=1):
              p = root / path
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences, found {count} for {old!r}')
              p.write_text(text.replace(old, new))

          # plan_steps.status allows PENDING/ACTIVE/COMPLETED/SKIPPED/FAILED/CANCELLED.
          # BLOCKED is not a legal DB value, so keep the blocked reason in result and persist FAILED.
          replace_exact(
              'src/services/planning-service.js',
              "SET status='BLOCKED'",
              "SET status='FAILED'",
          )
          replace_exact(
              'src/services/planning-service.js',
              'blockedSteps=refreshedPlan.steps.filter(candidate=>candidate.status==="BLOCKED").length',
              'failedSteps=refreshedPlan.steps.filter(candidate=>candidate.status==="FAILED").length',
          )
          replace_exact(
              'src/services/planning-service.js',
              'if(blockedSteps>0)',
              'if(failedSteps>0)',
              expected=2,
          )

          # goals.status does not include PENDING. Keep cognitive/recall queries aligned with the schema.
          for path in ('src/services/memory-service.js', 'src/services/decision-service.js'):
              p = root / path
              text = p.read_text()
              pattern = re.compile(r"(FROM goals\\b(?:(?!;).){0,1500}?)status IN \\('ACTIVE','PENDING'\\)", re.S)
              matches = list(pattern.finditer(text))
              if not matches:
                  raise SystemExit(f'{path}: no invalid goals status predicate found to replace')
              text = pattern.sub(lambda m: m.group(1) + "status IN ('DRAFT','ACTIVE','PAUSED')", text)
              p.write_text(text)

          # Interrupted actions may still carry a goal, but the engine call does not pass simulation/entity ids.
          # Resolve them from the authoritative goal row before advancing the plan.
          replace_exact(
              'src/services/autonomy-service.js',
              'async function completeGoalForAction(goalId,actionType,simulationTime,outcome,actionResult){if(!goalId)return null;return advancePlanForAction({simulationId:actionResult?.simulationId,entityId:actionResult?.entityId,goalId,actionType,outcome,simulationTime,actionResult});}',
              'async function completeGoalForAction(goalId,actionType,simulationTime,outcome,actionResult={}){if(!goalId)return null;let simulationId=actionResult?.simulationId||null,entityId=actionResult?.entityId||null;if(!simulationId||!entityId){const[rows]=await pool.query(`SELECT BIN_TO_UUID(simulation_id) AS simulationId,BIN_TO_UUID(entity_id) AS entityId FROM goals WHERE id=UUID_TO_BIN(?) LIMIT 1`,[goalId]);simulationId=simulationId||rows[0]?.simulationId||null;entityId=entityId||rows[0]?.entityId||null;}if(!simulationId||!entityId)return null;return advancePlanForAction({simulationId,entityId,goalId,actionType,outcome,simulationTime,actionResult});}',
          )

          # An interrupted movement did not arrive at its destination. Preserve that invariant in movements.
          replace_exact(
              'src/simulation/engine.js',
              "UPDATE movements SET status='COMPLETED',actual_arrival_simulation_at=?,reason='autonomous route interrupted by critical state',version=version+1",
              "UPDATE movements SET status='INTERRUPTED',actual_arrival_simulation_at=NULL,reason='autonomous route interrupted by critical state',version=version+1",
          )
          replace_exact(
              'src/simulation/engine.js',
              "UPDATE intentions SET status='COMPLETED',version=version+1 WHERE id=UUID_TO_BIN(?) AND status='ACTIVE'",
              "UPDATE intentions SET status='CANCELLED',version=version+1 WHERE id=UUID_TO_BIN(?) AND status='ACTIVE'",
          )

          # Simulation times are handled as UTC elsewhere in the engine. Keep environmental daylight on the same basis.
          replace_exact(
              'src/services/environment-service.js',
              'function hourOf(simulationTime){return new Date(simulationTime).getHours();}',
              'function hourOf(simulationTime){return new Date(simulationTime).getUTCHours();}',
          )

          # Add a small regression guard for the exact contract failures fixed above.
          test = root / 'test/schema-contract-regression.test.js'
          test.write_text('''const test=require("node:test");\nconst assert=require("node:assert/strict");\nconst fs=require("node:fs");\nconst path=require("node:path");\n\nconst src=path.join(__dirname,"../src");\nconst read=name=>fs.readFileSync(path.join(src,name),"utf8");\n\ntest("plan steps never persist the illegal BLOCKED status",()=>{\n  const planning=read("services/planning-service.js");\n  assert.doesNotMatch(planning,/status='BLOCKED'/);\n  assert.match(planning,/status='FAILED'/);\n});\n\ntest("goal queries use only schema-supported active states",()=>{\n  for(const file of ["services/memory-service.js","services/decision-service.js"]){\n    const source=read(file);\n    assert.doesNotMatch(source,/FROM goals[^;]{0,1500}status IN \\(\\'ACTIVE\\',\\'PENDING\\'\\)/s);\n  }\n});\n\ntest("interrupted goal completion can recover simulation/entity ownership from the goal",()=>{\n  const autonomy=read("services/autonomy-service.js");\n  assert.match(autonomy,/SELECT BIN_TO_UUID\\(simulation_id\\) AS simulationId,BIN_TO_UUID\\(entity_id\\) AS entityId FROM goals/);\n});\n''')
          PY

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

      - name: Syntax check backend JavaScript
        shell: bash
        run: |
          set -euo pipefail
          find src test -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/db-contract-audit-fix.yml
          git add asami-backend/src asami-backend/test/schema-contract-regression.test.js
          git commit -m "fix: align backend state transitions with database contract"
          git push origin HEAD:main
