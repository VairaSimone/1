name: Asami CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: asami-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: asami-backend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Syntax check all backend JavaScript
        shell: bash
        run: |
          set -euo pipefail
          find src test -name '*.js' -print0 | xargs -0 -n1 node --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: asami-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: asami-frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
