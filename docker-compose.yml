services:
  asami-db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
    volumes:
      - asami_mysql_data:/var/lib/mysql
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot --password=\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  asami-backend:
    build:
      context: ./asami-backend
    restart: unless-stopped
    env_file:
      - ./asami-backend/.env
    environment:
      NODE_ENV: production
      DB_HOST: asami-db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      DB_NAME: asami
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    depends_on:
      asami-db:
        condition: service_healthy
    networks:
      - app

  asami-frontend:
    build:
      context: ./asami-frontend
    restart: unless-stopped
    environment:
      ASAMI_FRONTEND_PASSWORD: ${ASAMI_FRONTEND_PASSWORD:?ASAMI_FRONTEND_PASSWORD must be set}
    depends_on:
      asami-backend:
        condition: service_started
    networks:
      - app
      - proxy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ASAMI_DOMAIN: ${ASAMI_DOMAIN:?ASAMI_DOMAIN must be set}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - asami_caddy_data:/data
      - asami_caddy_config:/config
    depends_on:
      asami-frontend:
        condition: service_started
    networks:
      - proxy

volumes:
  asami_mysql_data:
  asami_caddy_data:
  asami_caddy_config:

networks:
  app:
  proxy:
