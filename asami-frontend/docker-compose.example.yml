services:
  asami-backend:
    build: ../asami-backend
    restart: unless-stopped
    env_file:
      - ../asami-backend/.env
    expose:
      - "3000"

  asami-frontend:
    build: .
    restart: unless-stopped
    environment:
      ASAMI_FRONTEND_PASSWORD: ${ASAMI_FRONTEND_PASSWORD:?ASAMI_FRONTEND_PASSWORD must be set}
    ports:
      - "80:80"
    depends_on:
      - asami-backend
